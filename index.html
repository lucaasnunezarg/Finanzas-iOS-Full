<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MIS FINANZAS</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Finanzas">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@800;900&display=swap">
<style>:root{--bg:#000;--card:#0b0b0b;--bd:#262626;--mut:#7a7a7a;--mut2:#9a9a9a;--r:22px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#000;color:#fff;font:14px/1.4 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:#fff;background:#111;border:1px solid var(--bd);border-radius:12px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus{border-color:#666}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#888 50%),linear-gradient(135deg,#888 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.h{font-family:Montserrat,Inter,system-ui,sans-serif;font-weight:800;letter-spacing:.2px}
#app{display:flex;min-height:100vh}
#side{width:228px;flex:none;border-right:1px solid #161616;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
#side .lg{display:flex;align-items:center;gap:10px;padding:4px 10px 22px}
#side .lg img{width:34px;height:34px;object-fit:contain}
#side .lg b{font-family:Montserrat,Inter,sans-serif;font-weight:900;font-size:15px;letter-spacing:.5px}
.nv{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;color:#a8a8a8;font-weight:600;text-align:left;width:100%}
.nv svg{width:19px;height:19px;flex:none}
.nv.on{background:#fff;color:#000}
.nv:hover:not(.on){background:#111;color:#fff}
#main{flex:1;min-width:0;padding:22px 26px 60px}
#top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
#top h1{font-family:Montserrat,Inter,sans-serif;font-weight:900;font-size:26px;flex:1;min-width:140px}
.per{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pb{padding:8px 13px;border-radius:999px;border:1px solid var(--bd);font-size:12px;font-weight:700;color:#bbb;white-space:nowrap;letter-spacing:.3px}
.pb.on{background:#fff;color:#000;border-color:#fff}
.tg{display:flex;border:1px solid var(--bd);border-radius:999px;padding:3px}
.tg button{padding:6px 13px;border-radius:999px;font-size:12px;font-weight:700;color:#aaa}
.tg button.on{background:#fff;color:#000}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);display:inline-flex;align-items:center;justify-content:center;color:#ddd;flex:none}
.ib svg{width:17px;height:17px}
.ib.on{background:#fff;color:#000}
.ib.sm{width:28px;height:28px}.ib.sm svg{width:14px;height:14px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;align-items:start}
.w-S{grid-column:span 4}.w-M{grid-column:span 6}.w-L{grid-column:span 8}.w-F{grid-column:span 12}
.wd{position:relative;min-width:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:20px}
.card.hl{background:#fff;color:#000;border-color:#fff}
.card.hl .mut,.card.hl small{color:#555}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;min-height:28px}
.t{font-family:Montserrat,Inter,sans-serif;font-weight:800;font-size:12px;letter-spacing:1.2px;text-transform:uppercase}
.ca{display:flex;gap:8px;align-items:center}
.mut{color:var(--mut)}
small{color:var(--mut);font-size:12px}
.big{font-family:Montserrat,Inter,sans-serif;font-weight:900;font-size:40px;line-height:1.05;letter-spacing:-.5px}
.mid{font-family:Montserrat,Inter,sans-serif;font-weight:800;font-size:26px;line-height:1.1}
.sub{color:var(--mut2);font-size:13px;margin-top:6px}
.card.hl .sub{color:#444}
.more{font-size:12px;font-weight:700;color:#aaa;padding:4px 0}
.card.hl .more{color:#333}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:999px;font-weight:700;font-size:13px;border:1px solid var(--bd);white-space:nowrap}
.btn.wh{background:#fff;color:#000;border-color:#fff}
.btn.bk{background:#000;color:#fff;border-color:#000}
.btn.dg{color:#ff6b6b;border-color:#3a1a1a}
.btn svg{width:14px;height:14px}
.tb{display:flex;flex-direction:column}
.tr{display:grid;grid-template-columns:var(--c,1fr 90px);gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #151515;font-size:13px}
.tr:last-child{border-bottom:0}
.tr.th{font-size:10px;letter-spacing:1px;color:var(--mut);font-weight:700;text-transform:uppercase;padding-top:0}
.tr .r{text-align:right;font-variant-numeric:tabular-nums}
.tr .d{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr.tot{border-top:1px solid #fff;border-bottom:0;font-weight:800;margin-top:4px}
.card.hl .tr{border-color:#ddd}
.chk{width:22px;height:22px;border-radius:7px;border:1.5px solid #555;display:inline-flex;align-items:center;justify-content:center;flex:none}
.chk.on{background:#fff;border-color:#fff;color:#000}
.chk svg{width:14px;height:14px}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.5px;border:1px solid #333;color:#bbb;white-space:nowrap}
.chip.w{background:#fff;color:#000;border-color:#fff}
.chip.r{border-color:#ff6b6b;color:#ff6b6b}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.amt{transition:filter .15s}
body.hide-all .amt,.hideme .amt{filter:blur(9px);user-select:none}
.bar{height:8px;border-radius:4px;background:#1c1c1c;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px}
.dist{display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:center}
.drow{display:grid;grid-template-columns:12px 1fr 44px 96px;gap:10px;align-items:center;font-size:13px;margin:9px 0}
.drow i.dot{width:10px;height:10px;border-radius:50%}
.empty{color:var(--mut);padding:14px 0;font-size:13px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.hbar{display:flex;gap:6px;align-items:flex-end;height:120px;margin:10px 0 4px}
.hbar>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font-size:10px;color:var(--mut)}
.hbar i{display:block;width:100%;border-radius:6px 6px 0 0;background:#333;min-height:2px}
.hbar .cur i{background:#fff}
/* edición de widgets */
.editing .wd{outline:1.5px dashed #777;outline-offset:3px;border-radius:24px}
.editing .wd>.card{pointer-events:none;opacity:.55}
.wbar{display:none}
.editing .wbar{display:flex;position:absolute;z-index:5;top:8px;right:8px;left:8px;gap:6px;justify-content:space-between;align-items:center;background:#fff;color:#000;border-radius:999px;padding:5px 8px;box-shadow:0 4px 18px #000a}
.wbar button{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.wbar button.on{background:#000;color:#fff}
.wbar svg{width:16px;height:16px}
.wbar .g{display:flex;gap:2px;align-items:center}
.wbar .drag{cursor:grab;touch-action:none}
.wd.dragging{opacity:.4}
.hid-list{display:none;margin-top:16px}
.editing .hid-list{display:block}
.edbanner{display:none;background:#fff;color:#000;border-radius:16px;padding:12px 16px;margin-bottom:14px;font-weight:600;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.editing .edbanner{display:flex}
/* modal */
#modal{position:fixed;inset:0;background:#000c;z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
.sheet{background:#0b0b0b;border:1px solid var(--bd);border-radius:26px;width:min(560px,100%);max-height:92vh;overflow:auto;padding:22px}
.sheet.wide{width:min(900px,100%)}
.sheet h2{font-family:Montserrat,Inter,sans-serif;font-weight:900;font-size:18px;margin-bottom:14px}
.fl{margin-bottom:12px}
.fl label{display:block;font-size:11px;letter-spacing:.8px;color:var(--mut2);font-weight:700;text-transform:uppercase;margin-bottom:6px}
.fl.ck label{display:flex;align-items:center;gap:10px;text-transform:none;font-size:14px;color:#fff;letter-spacing:0}
.fl.ck input{width:20px;height:20px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.pal{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin:8px 0}
.pal i{aspect-ratio:1;border-radius:8px;cursor:pointer;border:2px solid transparent}
.pal i.on{border-color:#fff}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:999px;font-weight:700;font-size:13px;z-index:90;display:none}
#toast.on{display:block}
#lock,#setup{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:14px;text-align:center}
#lock.on,#setup.on{display:flex}
#lock img,#setup img{width:76px;margin-bottom:6px}
.pin{display:grid;grid-template-columns:repeat(3,70px);gap:12px;margin-top:8px}
.pin button{height:62px;border-radius:50%;border:1px solid var(--bd);font-size:22px;font-weight:700}
.dots{display:flex;gap:12px;height:14px}
.dots i{width:12px;height:12px;border-radius:50%;border:1.5px solid #888}
.dots i.on{background:#fff;border-color:#fff}
.sset{width:min(420px,100%);text-align:left}
.sec{margin-bottom:22px}
.sec h3{font-family:Montserrat,Inter,sans-serif;font-weight:800;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:10px;color:#fff}
.ln{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #151515}
.ln:last-child{border-bottom:0}
.ln small{display:block;margin-top:2px}
.sw{width:46px;height:26px;border-radius:999px;background:#2a2a2a;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:#fff}.sw.on::after{left:23px;background:#000}
.code{background:#111;border:1px solid var(--bd);border-radius:12px;padding:12px;font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-all}
#bnav{display:none}
@media(max-width:860px){
  #side{display:none}
  #main{padding:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-right,0px) + 12px) 96px calc(env(safe-area-inset-left,0px) + 12px)}
  #top{gap:10px}
  #top h1{font-size:22px;flex:1 1 60%}
  .per{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;width:100%;order:5;padding-bottom:4px;scrollbar-width:none}
  .per::-webkit-scrollbar{display:none}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .w-S{grid-column:span 1}.w-M,.w-L,.w-F{grid-column:span 2}
  .card{padding:16px;border-radius:20px}
  .big{font-size:32px}
  .dist{grid-template-columns:1fr}
  .drow{grid-template-columns:12px 1fr 38px 84px}
  .hm{display:none!important}
  #bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:#000e;backdrop-filter:blur(14px);border-top:1px solid #1a1a1a;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}
  #bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;color:#888;padding:4px 0}
  #bnav button svg{width:21px;height:21px}
  #bnav button.on{color:#fff}
  .sheet{border-radius:26px 26px 0 0;align-self:flex-end;max-height:94vh}
  #modal{padding:0}
  .row2{grid-template-columns:1fr}
}
@media(min-width:861px){.mo{display:none!important}}
/* tablas de egresos */
.te{grid-template-columns:26px minmax(0,1fr) 124px 38px 104px 62px!important}
.tb.nochk .te{grid-template-columns:minmax(0,1fr) 124px 38px 104px 62px!important}
.tb.nochk .te>.c1{display:none}
.tr.te.th{padding-top:0}
.card.hl .ib{color:#000;border-color:#bbb}
.hbar>div{max-width:none}.hbar i{max-width:70px;margin:0 auto}
.empresa-sm{margin-bottom:6px;display:block}
.d2{min-width:0;display:flex;flex-direction:column;gap:3px;align-items:flex-start}.d2 .d{max-width:100%}
.t2{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.sm2{font-size:11px;color:var(--mut)}
.tr .r{white-space:nowrap}
.morerow{display:block;width:100%;padding:12px 0 4px;margin-top:2px;border-top:1px solid #151515;text-align:center;font-size:12px;font-weight:700;color:#bbb;letter-spacing:.3px}
.morerow:active{color:#fff}
.mhead{display:flex;align-items:center;justify-content:space-between;position:sticky;top:-22px;z-index:3;margin:-22px -22px 12px;padding:16px 22px 10px;background:#0b0b0b;border-bottom:1px solid #151515}
.sheet{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
/* sin zoom */
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
.drag{touch-action:none}
/* transiciones */
@keyframes vin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes vfade{from{opacity:0}to{opacity:1}}
@keyframes sheetup{from{opacity:0;transform:translateY(26px) scale(.985)}to{opacity:1;transform:none}}
#view.enter>*{animation:vin .38s cubic-bezier(.2,.7,.2,1) backwards}
#top.enter{animation:vfade .28s ease}
#view.fade{animation:vfade .22s ease}
#modal.on{animation:vfade .18s ease}
#modal.on .sheet{animation:sheetup .28s cubic-bezier(.2,.7,.2,1)}
#lock.on,#setup.on{animation:vfade .2s ease}
.pb,.tg button,.nv,#bnav button,.btn,.chk,.ib,.sw,.sw::after{transition:background .18s,color .18s,border-color .18s,transform .12s,left .15s}
.ib:active,.btn:active,.pb:active,.chk:active{transform:scale(.93)}
#bnav button:active{transform:scale(.92)}
#view.enter>:nth-child(2){animation-delay:0.04s}
#view.enter>:nth-child(3){animation-delay:0.08s}
#view.enter>:nth-child(4){animation-delay:0.12s}
#view.enter>:nth-child(5){animation-delay:0.16s}
#view.enter>:nth-child(6){animation-delay:0.20s}
#view.enter>:nth-child(7){animation-delay:0.24s}
#view.enter>:nth-child(8){animation-delay:0.28s}
#view.enter>:nth-child(9){animation-delay:0.32s}
#view.enter>:nth-child(10){animation-delay:0.36s}
#view.enter>:nth-child(11){animation-delay:0.40s}
#view.enter>:nth-child(12){animation-delay:0.40s}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media(max-width:860px){
  body::before{content:"";position:fixed;top:0;left:0;right:0;height:calc(env(safe-area-inset-top,0px) + 26px);background:linear-gradient(to bottom,#000 0,#000 calc(100% - 26px),rgba(0,0,0,0) 100%);z-index:30;pointer-events:none}
  input,select,textarea{font-size:16px}
  .tr{gap:8px}
  .tr .d{white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;text-overflow:clip;word-break:break-word}
  .tr .ed{display:none!important}
  .tr[data-rt]:active{background:#101010}
  .te{grid-template-columns:28px minmax(0,1fr) auto!important}
  .tb.nochk .te{grid-template-columns:minmax(0,1fr) auto!important}
  .te .vc{display:none}
  .tr.ig,.tr.lg{grid-template-columns:44px minmax(0,1fr) auto!important}
  .tr.rp,.tr.sb{grid-template-columns:40px minmax(0,1fr) auto!important}
  .tr.dl,.tr.db,.tr.mr,.tr.or{grid-template-columns:minmax(0,1fr) auto!important}
  .t2 small{font-size:11px}
}
.sheet>.card{border:0;padding:0;background:transparent;border-radius:0}
</style></head><body>
<div id="app"><aside id="side"></aside><main id="main"><header id="top"></header><div id="view" class="grid"></div></main></div>
<nav id="bnav"></nav><div id="modal"></div><div id="toast"></div><div id="lock"></div><div id="setup"></div>
<script>'use strict';
/* ===== utilidades ===== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf0=new Intl.NumberFormat('es-AR',{maximumFractionDigits:0}),nf2=new Intl.NumberFormat('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
const ars=n=>(n<0?'-':'')+'$'+nf0.format(Math.abs(Math.round(n)));
const usd=n=>(n<0?'-':'')+'US$ '+nf2.format(Math.abs(n));
const eur=n=>(n<0?'-':'')+'€ '+nf2.format(Math.abs(n));
const money=(n,c)=>c==='USD'?usd(n):c==='EUR'?eur(n):ars(n);
const AM=h=>`<span class="amt">${h}</span>`;
const uid=()=>'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MES3=['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
const todayISO=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Argentina/Buenos_Aires'}).format(new Date());
const addDays=(iso,n)=>{const d=new Date(iso+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const diffDays=(a,b)=>Math.round((new Date(a+'T12:00:00Z')-new Date(b+'T12:00:00Z'))/864e5);
const curMes=()=>todayISO().slice(0,7);
const mesAdd=(m,n)=>{let[y,k]=m.split('-').map(Number);k+=n;y+=Math.floor((k-1)/12);k=((k-1)%12+12)%12+1;return y+'-'+String(k).padStart(2,'0')};
const mesName=m=>MESES[+m.slice(5)-1];
const mesTxt=m=>MES3[+m.slice(5)-1]+'/'+m.slice(2,4);
const mesesEntre=(a,b)=>{const r=[];for(let m=a;m<=b;m=mesAdd(m,1)){r.push(m);if(r.length>400)break}return r};
const fmtFecha=f=>f?f.slice(8,10)+'/'+f.slice(5,7):'';
/* ===== estado ===== */
const KEY={Ingresos:'id',Egresos:'id',Cotizaciones:'mes',Reparto:'id',Subreparto:'id',Registros:'id',Deudas:'id',OtrosAhorros:'id',Mercury:'id',Historial:'fecha'};
const S={data:LS.get('cache',{}),cfg:LS.get('cachecfg',{}),sec:LS.get('sec','resumen'),per:LS.get('per',{k:'C'}),cur:LS.get('cur','todo'),edit:false,live:false};
const CFG={url:LS.get('url',''),token:LS.get('token','')};
const D=t=>S.data[t]||(S.data[t]=[]);
const isMobile=()=>matchMedia('(max-width:860px)').matches;
/* ===== red ===== */
let queue=LS.get('queue',[]);
async function apiGet(action){const r=await fetch(CFG.url+'?action='+action+'&token='+encodeURIComponent(CFG.token),{redirect:'follow'});return r.json()}
async function apiPost(body){const r=await fetch(CFG.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,token:CFG.token}),redirect:'follow'});return r.json()}
let flushing=false;
async function flush(){if(flushing||!queue.length||!CFG.url)return;flushing=true;
  try{while(queue.length){const op=queue[0];const r=await apiPost(op);if(!r.ok&&r.error!=='no autorizado'&&!/Failed/.test(r.error||''))console.warn('op falló',r.error);queue.shift();LS.set('queue',queue)}}
  catch(e){/* sin red: queda en cola */}

  form({title:r?'Editar ingreso':'Nuevo ingreso',fields:[{k:'fecha',l:'Fecha',t:'date',v:r?r.fecha:todayISO(),req:1},{k:'descripcion',l:'Descripción',v:r&&r.descripcion,req:1},
   {k:'moneda',l:'Moneda',t:'select',opts:monedaOpts(r&&r.moneda,'USD'),v:r?r.moneda:'USD'},{k:'monto',l:'Monto',t:'number',v:r?r.monto:'',ph:'0'}],
   onOk:o=>{up('Ingresos',{id:r?r.id:uid(),fecha:o.fecha,mes:o.fecha.slice(0,7),descripcion:o.descripcion,categoria:r?r.categoria:'',moneda:o.moneda,monto:o.monto,notas:r?r.notas:''})},
   onDel:r?()=>del('Ingresos',r.id):null})}
function formEgr(id,pre){const r=id?D('Egresos').find(x=>x.id===id):null;const P=PD();const cs=[...new Set([...cats().map(c=>c.n),'Otros'])];
  form({title:r?'Editar egreso':'Nuevo egreso',fields:[{k:'descripcion',l:'Descripción',v:r&&r.descripcion,req:1},
   {k:'grupo',l:'Tipo de gasto',t:'select',opts:[{v:'FIJOS',l:'FIJO'},{v:'VARIABLES',l:'VARIABLE'},{v:'DIA A DIA',l:'DÍA A DÍA'}],v:r?(r.grupo||'VARIABLES'):(pre&&pre.grupo)||'VARIABLES'},
   {k:'categoria',l:'Categoría',t:'select',opts:cs,v:r?r.categoria:'Otros'},
   {k:'moneda',l:'Moneda',t:'select',opts:monedaOpts(r&&r.moneda),v:r?r.moneda:'ARS'},{k:'monto',l:'Monto',t:'number',v:r?r.monto:'',ph:'0'},
   {k:'mes',l:'Mes',t:'select',opts:monthOpts(),v:r?r.mes:monthOfP(P)},{k:'venc',l:'Vencimiento (opcional)',t:'date',v:r&&r.venc},
   {k:'empresa',l:'Es de la empresa',t:'check',v:r?Number(r.empresa)===1:(pre&&pre.empresa)||0},{k:'pagado',l:'Pagado (Día a día siempre cuenta como pagado)',t:'check',v:r&&Number(r.pagado)===1}],
   onOk:o=>{up('Egresos',{id:r?r.id:uid(),mes:o.mes,descripcion:o.descripcion,categoria:o.categoria,grupo:o.empresa?'':o.grupo,moneda:o.moneda,monto:o.monto,venc:o.venc||'',pagado:(o.grupo==='DIA A DIA'&&!o.empresa)?1:o.pagado,empresa:o.empresa,tarjeta:r?r.tarjeta:0})},
   onDel:r?()=>del('Egresos',r.id):null})}
function formCot(mes){const m=mes||monthOfP(PD());const r=D('Cotizaciones').find(x=>x.mes===m);const e24=m<='2024-12';
  const f=[{k:'usd',l:'Pesos por US$ 1',t:'number',v:r?r.usd:cotOf(m)}];if(e24)f.push({k:'eur',l:'US$ por € 1 (solo 2024)',t:'number',v:eurOf(m)});
  form({title:'Cotización de '+mesName(m)+' '+m.slice(0,4),fields:f,onOk:o=>{if(!o.usd)return false;up('Cotizaciones',{mes:m,usd:o.usd},true);if(e24&&o.eur>0){const mp={...(cfg('eur',{})||{})};mp[m]=o.eur;setCfg('eur',mp,true)}render()}})}
/* ---- listas ---- */
function rowIng(r){return `<div class="tr ig" data-rt="edIng" data-p="${r.id}" style="--c:52px minmax(0,1fr) 120px 62px"><span class="mut">${fmtFecha(r.fecha)}</span><span class="d">${esc(r.descripcion)}</span><span class="r"><b>${AM(money(r.monto,r.moneda))}</b></span>${editDel('edIng','delIng',r.id)}</div>`}
function rowEgr(e){const dia=isDia(e),pd=Number(e.pagado)===1;return `<div class="tr te" data-rt="edEgr" data-p="${e.id}"><span class="c1">${dia?'':chkB(pd,'pay',e.id)}</span><span class="d2"><span class="d" style="${pd&&!dia?'color:#777':''}">${esc(e.descripcion)}</span><span class="mo">${vencChip(e)}</span></span><span class="vc">${vencChip(e)}</span><span class="hm mut" style="font-size:11px">${esc(e.moneda||'ARS')}</span><span class="r"><b>${AM(money(e.monto,e.moneda||'ARS'))}</b></span>${editDel('edEgr','delEgr',e.id)}</div>`}
const egrHead=()=>`<div class="tr te th"><span class="c1"></span><span>Descripción</span><span class="vc">Vence</span><span class="hm">Mon.</span><span class="r">Monto</span><span class="ed"></span></div>`;
const moreRow=(tot,shown,wid,full)=>(!full&&wid&&tot>shown)?`<button class="morerow" data-a="more" data-p="${esc(wid)}">+${tot-shown} más ›</button>`:'';
function egrTable(list,full,n,emptyMsg,wid){if(!list.length)return empty(emptyMsg||'Sin registros en este período');
  const L=lim(list,full,n),nc=list.every(isDia);return `<div class="tb${nc?' nochk':''}">${egrHead()}${L.map(e=>rowEgr(e)).join('')}</div>`+moreRow(list.length,L.length,wid,full)}
const sortEgr=(a,b)=>(a.venc||'9')<(b.venc||'9')?-1:(a.venc||'9')>(b.venc||'9')?1:0;
function totEgrRow(list,lbl){const t=sumV(list,vEgr);return `<div class="tr tot" style="--c:1fr auto"><span>${lbl||'TOTAL'}</span><span class="r">${AA(t,'ars')}</span></div>`}
/* ---- widgets resumen ---- */
const W={};
W.hero=()=>{const P=PD(),ing=totIng(P),egr=totEgr(P),b=subV(ing,egr);
  return `<div class="card hl"><div class="ch"><span class="t">${heroTitle('BALANCE',P)}</span>${eyeBtn('all')}</div><div class="big">${AA(b)}</div><div class="sub">${AS(b)||'Ingresos menos egresos'}</div></div>`};
W.cot=()=>{const P=PD(),mm=P.t==='M'?P.mes:P.to.slice(0,7);const e24=mm<='2024-12';
  return `<div class="card">${hdr('Cotización USD',`<button class="ib sm" data-a="edCot" data-p="${mm}">${I('pen')}</button>`)}<div class="mid">${ars(cotOf(mm))} <small>por US$ 1 · ${mesName(mm)}</small></div>${e24?`<div class="sub">€ 1 = US$ ${nf2.format(eurOf(mm))} · solo 2024</div>`:''}<div style="margin-top:12px"><button class="more" data-a="histCot">Ver historial de meses ›</button></div></div>`};
W.cIng=(f)=>{const P=PD(),L=ingresosP(P),t=sumV(L,vIng);return `<div class="card">${hdr('Ingresos',eyeBtn('cIng'),'')}<div class="mid">${AA(t)}</div><div class="sub">${AS(t)||L.length+' movimientos'}</div></div>`};
W.cEgr=()=>{const P=PD(),L=egresosP(P),t=sumV(L,vEgr);const[pg,n]=cnt(L);return `<div class="card">${hdr('Egresos',eyeBtn('cEgr'))}<div class="mid">${AA(t,'ars')}</div><div class="sub">${AS(t,'ars')||''}${S.cur==='todo'?' · ':''}${pg} de ${n} pagados</div></div>`};
W.dist=(full)=>{const P=PD(),L=egresosP(P);const m=S.cur==='usd'?'usd':'ars';const by={};L.forEach(e=>{const k=e.categoria||'Otros';by[k]=(by[k]||0)+vEgr(e)[m]});
  const items=Object.entries(by).map(([n,v])=>({n,v,c:catColor(n)})).sort((a,b)=>b.v-a.v);const tot=items.reduce((s,i)=>s+i.v,0)||1;
  const bud=cfg('presup',{});
  return `<div class="card">${hdr('Distribución de egresos',`<button class="btn" data-a="editCats">Editar categorías</button>`)}${!items.length?empty('Sin egresos en este período'):`<div class="dist"><div style="display:flex;justify-content:center">${donut(items)}</div><div>${items.map(i=>`<div class="drow"><i class="dot" style="background:${i.c}"></i><span class="d">${esc(i.n)}${bud[i.n]?` <small>/ ${AM(m==='usd'?usd(bud[i.n]/cotOf(monthOfP(P)) ):ars(bud[i.n]))}</small>`:''}</span><b style="text-align:right">${Math.round(i.v/tot*100)}%</b><span class="r mut" style="text-align:right">${AM(m==='usd'?usd(i.v):ars(i.v))}</span></div>`).join('')}</div></div>`}</div>`};
W.evo=()=>{const P=PD(),m0=monthOfP(P),ms=mesesEntre(mesAdd(m0,-5),m0),k=S.cur==='ars'?'ars':'usd';
  const a=ms.map(m=>totIngMes(m)[k]),b=ms.map(m=>totEgrMes(m)[k]);
  return `<div class="card">${hdr('Evolución',`<span class="ca" style="font-size:11px;color:#aaa"><span style="display:inline-block;width:18px;border-top:2.5px solid #fff"></span>Ingresos <span style="display:inline-block;width:18px;border-top:2px dotted #9a9a9a;margin-left:8px"></span>Egresos</span>`)}${lineChart(a,b,ms.map(m=>MES3[+m.slice(5)-1]))}</div>`};
W.lIng=(full)=>{const L=ingresosP(PD());return `<div class="card">${hdr('Ingresos',addBtn('addIng','','Nuevo','wh'),'lIng')}${L.length?`<div class="tb">${lim(L,full).map(rowIng).join('')}</div>${moreRow(L.length,6,'lIng',full)}`:empty('Sin ingresos en este período')}</div>`};
W.lEgr=(full)=>{const L=egresosP(PD()).filter(e=>Number(e.empresa)!==1).sort(sortEgr);return `<div class="card">${hdr('Egresos',addBtn('addEgr','','Nuevo','wh'),'lEgr')}${egrTable(L,full,6,null,'lEgr')}</div>`};
function empresaCard(titulo,full,more){const L=egresosP(PD()).filter(e=>Number(e.empresa)===1).sort(sortEgr);const[pg,n]=cnt(L);
  return `<div class="card">${hdr(titulo,addBtn('addEmp','','Nuevo','wh'),more)}${L.length?`<small>${pg} de ${n} pagados</small>`:''}${egrTable(L,full,6,null,more)}${L.length?totEgrRow(L):''}</div>`}
W.empresaR=(full)=>empresaCard('EMPRESA | EGRESOS',full,'empresaR');
W.pend=(full)=>{const L=egresosP(PD()).filter(e=>!isPaid(e)&&(e.grupo==='FIJOS'||e.grupo==='VARIABLES')).sort(sortEgr);
  return `<div class="card">${hdr('Pendientes del mes',L.length?`<small>${L.length} sin pagar</small>`:'','pend')}${egrTable(L,full,6,'No hay fijos ni variables sin pagar','pend')}${L.length?totEgrRow(L,'POR PAGAR'):''}</div>`};
W.ahR=()=>{const a=totalAhorros();return `<div class="card">${hdr('Ahorros',eyeBtn('ahR'),'')}<div class="mid">${AA(a.tot)}</div><div class="sub">${AS(a.tot)}</div><div style="margin-top:12px"><button class="more" data-a="go" data-p="ahorros">Ver más ›</button></div></div>`};
W.deR=()=>{const t=sumV(deudasAct(),d=>vDeu(d,'monto_actual'));return `<div class="card">${hdr('Préstamos y deudas',eyeBtn('deR'))}<div class="mid">${AA(t)}</div><div class="sub">${AS(t)}</div><div style="margin-top:12px"><button class="more" data-a="go" data-p="deudas">Ver más ›</button></div></div>`};
/* ---- ingresos ---- */
W.heroI=()=>{const P=PD(),t=totIng(P);return `<div class="card hl"><div class="ch"><span class="t">${heroTitle('LO QUE GANASTE',P)}</span>${eyeBtn('all')}</div><div class="big">${AA(t)}</div><div class="sub">${AS(t)}</div></div>`};
W.mov=(full)=>{const L=ingresosP(PD());return `<div class="card">${hdr('Movimientos',addBtn('addIng','','Nuevo ingreso','wh'))}${L.length?`<div class="tb">${lim(L,full,8).map(rowIng).join('')}</div>${moreRow(L.length,8,'mov',full)}`:empty('Sin ingresos en este período')}</div>`};
function bucket(it){const P=PD(),c=itemCalc(it,P);
  if(it.modo==='registro')return `<div class="card">${hdr(esc(itemLabel(it)),eyeBtn('rb_'+it.id))}<div class="mid">${AA(c.monto)}</div><div class="sub">Balance ${AA(c.bal)}${S.cur==='todo'?' · '+AM(ars(c.bal.ars)):''}</div>
   <div class="tr" style="--c:1fr auto;margin-top:10px"><span class="mut">Arrastre de meses anteriores</span><span class="r">${AA(c.arr)}</span></div><div class="tr" style="--c:1fr auto"><span class="mut">Registro del mes</span><span class="r">${AA(c.rg)}</span></div></div>`;
  return `<div class="card">${hdr(esc(itemLabel(it)),eyeBtn('rb_'+it.id))}<div class="mid">${AA(c.monto)}</div><div class="sub">${AS(c.monto)||''}</div><div class="sub" style="font-size:12px">Se calcula sobre los ingresos. Solo se calcula, sin registro</div></div>`}
function repTable(full){const P=PD(),ing=totIng(P),its=repItems(),tp=its.reduce((s,i)=>s+(+i.pct||0),0),c='46px minmax(0,1fr) 112px 112px 92px';
  const rows=its.map(it=>{const v=mulV(ing,it.pct/100);return `<div class="tr rp" data-rt="edItem" data-p="${it.id}" style="--c:${c}"><span class="mut">${it.pct}%</span><span class="d">${esc(it.nombre)}</span><span class="r hm">${AM(usd(v.usd))}</span><span class="r hm">${AM(ars(v.ars))}</span><span class="r mo t2"><b>${AM(usd(v.usd))}</b><small>${AM(ars(v.ars))}</small></span><span class="ed" style="display:inline-flex;gap:3px;justify-content:flex-end"><button class="ib sm" data-a="itUp" data-p="${it.id}">${I('up')}</button><button class="ib sm" data-a="itDown" data-p="${it.id}">${I('down')}</button><button class="ib sm" data-a="edItem" data-p="${it.id}">${I('pen')}</button></span></div>`}).join('');
  return `<div class="card">${hdr('Reparto por porcentajes',addBtn('addItem','','Nuevo registro','wh'))}<div class="tb"><div class="tr th rp" style="--c:${c}"><span>%</span><span>Destinado</span><span class="r hm">USD</span><span class="r hm">Monto ARS</span><span class="r mo">Monto</span><span class="ed"></span></div>${rows}<div class="tr tot rp" style="--c:${c}"><span>${tp}%</span><span>TOTAL</span><span class="r hm">${AM(usd(ing.usd*tp/100))}</span><span class="r hm">${AM(ars(ing.ars*tp/100))}</span><span class="r mo t2"><b>${AM(usd(ing.usd*tp/100))}</b><small>${AM(ars(ing.ars*tp/100))}</small></span><span class="ed"></span></div></div>${tp!==100?`<div class="empty">Los porcentajes suman ${tp}%, no 100%.</div>`:''}</div>`}
function subTable(it){const P=PD(),c=itemCalc(it,P),ing=c.ing,subs=repSubs(it.id);const base=sb=>sb.base==='ingresos'?ing:c.monto,rg_=it.modo==='registro',g='46px minmax(0,1fr) 110px 110px 64px';
  const rows=subs.map(s=>{const d=mulV(base(s),s.pct/100);const reg=sumV(c.regs.filter(r=>r.sub===s.nombre),r=>r.v);
    return `<div class="tr sb" data-rt="edSub" data-p="${s.id}" style="--c:${g}"><span class="mut">${s.pct}%</span><span class="d">${esc(s.nombre)}</span><span class="r hm">${AA(d)}</span><span class="r mut hm">${rg_?AA(reg):''}</span><span class="r mo t2"><b>${AA(d)}</b>${rg_?`<small>gastado ${AA(reg)}</small>`:''}</span>${editDel('edSub','delSub',s.id)}</div>`}).join('');
  return `<div class="card">${hdr(esc(itemLabel(it)),addBtn('addSub',it.id,'Nuevo registro','wh'))}<div class="tb"><div class="tr th sb" style="--c:${g}"><span>%</span><span>Destinado</span><span class="r hm">Monto</span><span class="r hm">${rg_?'Gastado':''}</span><span class="r mo">Monto</span><span class="ed"></span></div>${rows||empty('Sin subreparto')}</div></div>`}
function ledger(it,full){const P=PD(),c=itemCalc(it,P),wid='rl_'+it.id;
  const rows=lim(c.regs,full,8).map(r=>`<div class="tr lg" data-rt="${r._t==='R'?'edReg':'edEgr'}" data-p="${r.id}" style="--c:48px minmax(0,1fr) 120px 62px"><span class="mut">${fmtFecha(r.fecha)}</span><span class="d">${esc(r.descripcion)}${r.sub?` <span class="chip">${esc(r.sub)}</span>`:''}${r._t==='E'?' <span class="chip">egreso</span>':''}</span><span class="r"><b>${AM(money(r.monto,r.moneda))}</b></span>${r._t==='R'?editDel('edReg','delReg',r.id):'<span class="ed"></span>'}</div>`).join('');
  return `<div class="card">${hdr(esc(itemLabel(it)),addBtn('addReg',it.id,'Nuevo registro','wh'),'')}<div class="tr" style="--c:1fr auto"><span class="mut">Arrastre de meses anteriores</span><span class="r">${AA(c.arr)}</span></div><div class="tr" style="--c:1fr auto"><span class="mut">${it.pct}% ${P.t==='M'?'del mes':'del período'}</span><span class="r">${AA(c.monto)}</span></div>${rows}${moreRow(c.regs.length,8,wid,full)}${c.regs.length?'':empty('Sin registros en este período')}<div class="tr tot" style="--c:1fr auto"><span>BALANCE</span><span class="r">${AA(c.bal)}</span></div></div>`}
/* ---- egresos ---- */
W.heroE=()=>{const P=PD(),L=egresosP(P),t=sumV(L,vEgr);const[pg,n]=cnt(L);
  return `<div class="card hl"><div class="ch"><span class="t">${heroTitle('EGRESOS',P)}</span>${eyeBtn('all')}</div><div class="big">${AA(t,'ars')}</div><div class="sub">${AS(t,'ars')||''}${S.cur==='todo'?' · ':''}${pg} de ${n} pagados</div>
  <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn bk" data-a="addEgr">${I('plus')}Nuevo egreso</button><button class="btn" style="color:#000;border-color:#000" data-a="dupMes">Duplicar mes</button></div></div>`};
function grupoCard(g,lbl,full){const L=egresosP(PD()).filter(e=>Number(e.empresa)!==1&&(e.grupo||'VARIABLES')===g).sort(sortEgr);const dia=g==='DIA A DIA',[pg,n]=cnt(L);
  return `<div class="card">${hdr(lbl,addBtn('addEgrG',g,'Nuevo','wh'),'g_'+g)}${L.length?`<small>${dia?L.length+' gastos del día a día':pg+' de '+n+' pagados'}</small>`:''}${egrTable(L,full,8,null,'g_'+g)}${L.length?totEgrRow(L):''}</div>`}
/* ---- ahorros ---- */
function updTxt(){const m=D('Mercury')[0];if(!m||!m.updated)return 'Sin actualizar todavía';return 'Actualizado '+String(m.updated).slice(0,16).replace('T',' ')}
W.heroA=()=>{const a=totalAhorros();return `<div class="card hl"><div class="ch"><span class="t">TOTAL AHORROS</span>${eyeBtn('all')}</div><div class="big">${AA(a.tot)}</div><div class="sub">${AS(a.tot)}</div></div>`};
W.mer=()=>{const a=totalAhorros();return `<div class="card hl"><div class="ch"><span class="t">Mercury</span>${eyeBtn('mer')}</div><div class="mid">${AA(a.mer)}</div><div class="sub">${AS(a.mer)} · ${updTxt()}</div></div>`};
W.otr=()=>{const a=totalAhorros();return `<div class="card hl"><div class="ch"><span class="t">Otros ahorros</span>${eyeBtn('otr')}</div><div class="mid">${AA(a.otros)}</div><div class="sub">${AS(a.otros)}</div></div>`};
W.merL=(full)=>{const L=D('Mercury');return `<div class="card">${hdr('Cuentas')}${L.length?`<div class="tb">${L.map(r=>`<div class="tr mr" style="--c:minmax(0,1fr) 120px"><span class="d">${esc(r.nombre)} <span class="mut">${r.ult4?'••'+esc(r.ult4):''}</span></span><span class="r"><b>${AM(usd(+r.saldo||0))}</b></span></div>`).join('')}</div>`:empty('Mercury se carga solo todos los días a las 00:00')}</div>`};
W.otrL=(full)=>{const L=D('OtrosAhorros');return `<div class="card">${hdr('Cuentas',addBtn('addOtr','','Nuevo','wh'))}${L.length?`<div class="tb">${L.map(r=>`<div class="tr or" data-rt="edOtr" data-p="${r.id}" style="--c:minmax(0,1fr) 112px 62px"><span class="d">${esc(r.donde)} <span class="mut">${esc(r.descripcion||'')}</span></span><span class="r"><b>${AM(money(r.monto,r.moneda))}</b></span>${editDel('edOtr','delOtr',r.id)}</div>`).join('')}</div>`:empty('Todavía no cargaste cuentas')}</div>`};
function histSeries(col){const H=D('Historial').filter(r=>r.fecha).sort((a,b)=>a.fecha<b.fecha?-1:1);const byM={};H.forEach(r=>{if(r[col]!==''&&r[col]!=null)byM[String(r.fecha).slice(0,7)]=+r[col]||0});
  const a=totalAhorros();byM[curMes()]=col==='mercury'?a.mer.usd:a.otros.usd;const ms=Object.keys(byM).sort().slice(-(isMobile()?6:12));return ms.map(m=>({m,v:byM[m]}))}
function histCard(col){const s=histSeries(col),mx=Math.max(1,...s.map(x=>x.v));const last=s[s.length-1],prev=s[s.length-2];
  let delta='Se empieza a registrar desde hoy: cada día se guarda una foto y acá se compara contra meses anteriores.';
  if(prev){const d=last.v-prev.v,p=prev.v?d/prev.v*100:0;delta=`${d>=0?'+':'-'}${usd(Math.abs(d))} (${d>=0?'+':''}${p.toFixed(1).replace('.',',')}%) frente a ${mesName(prev.m)}`}
  return `<div class="card">${hdr('Historial')}<div class="hbar">${s.map((x,i)=>`<div class="${i===s.length-1?'cur':''}"><span class="amt">${nf0.format(x.v)}</span><i style="height:${Math.max(3,x.v/mx*84)}%"></i><span>${MES3[+x.m.slice(5)-1]}</span></div>`).join('')}</div><div class="sub" style="font-size:12px">${AM(delta)}</div></div>`}
W.merH=()=>histCard('mercury');W.otrH=()=>histCard('otros');
/* ---- deudas ---- */

  if(sec==='ahorros')return[['heroA','F','F'],['mer','M','F'],['merL','M','F'],['merH','F','F'],['otr','M','F'],['otrL','M','F'],['otrH','F','F']].map(a=>({id:a[0],d:a[1],m:a[2],r:W[a[0]]}));

function allPerOptions(){const c=curMes(),o=[];for(let i=0;i<12;i++){const m=mesAdd(c,-i);o.push({k:'M',v:m})}

const canon=p=>p.k==='C'?{k:'M',v:curMes()}:p.k==='P'?{k:'M',v:mesAdd(curMes(),-1)}:p;
const uncanon=p=>p.k==='M'&&p.v===curMes()?{k:'C'}:p.k==='M'&&p.v===mesAdd(curMes(),-1)?{k:'P'}:p;
function persModal(){let chosen=periodos().filter(p=>p.k!=='PERS').map(canon);const opts=allPerOptions().map(canon);const hoy=todayISO();
  const isOn=p=>chosen.some(x=>samePer(x,p));
  modal(`<h2>Personalizado</h2><div class="sec"><h3>Elegir un rango</h3><div class="row2"><div class="fl"><label>Desde</label><input type="date" id="pf" value="${S.per.k==='R'?S.per.from:addDays(hoy,-29)}"></div><div class="fl"><label>Hasta</label><input type="date" id="pt" value="${S.per.k==='R'?S.per.to:hoy}"></div></div>

  const m=$('#modal');
  const commit=()=>{const mons=chosen.filter(x=>x.k==='M').sort((a,b)=>a.v<b.v?-1:1);const rest=opts.filter(o=>o.k!=='M'&&isOn(o));setCfg('periodos',[...mons,...rest].map(uncanon).concat([{k:'PERS'}]),true)};
  $('#papp',m).onclick=()=>{const f=$('#pf').value,t=$('#pt').value;if(!f||!t||f>t){toast('Revisá las fechas');return}S.per={k:'R',from:f,to:t};LS.set('per',S.per);closeModal();render()};
  $('#psave',m).onclick=()=>{const f=$('#pf').value,t=$('#pt').value,l=$('#pl').value.trim();if(!f||!t||f>t){toast('Revisá las fechas');return}const p={k:'R',from:f,to:t,label:(l||fmtFecha(f)+'–'+fmtFecha(t)).toUpperCase()};
    const ps=periodos().filter(x=>x.k!=='PERS');setCfg('periodos',[...ps,p,{k:'PERS'}],true);S.per=p;LS.set('per',p);closeModal();render()};
  $$('[data-o]',m).forEach(b=>b.onclick=()=>{const p=opts[+b.dataset.o];if(isOn(p))chosen=chosen.filter(x=>!samePer(x,p));else chosen.push(p);commit();b.classList.toggle('on');renderTop()})}

let pinBuf='',lockMode='check',pinCb=null;
function showLock(msg){const L=LS.get('lock',null);if(!L)return;const el=$('#lock');el.classList.add('on');drawLock(msg)}
function drawLock(msg,title){const L=LS.get('lock',null),el=$('#lock');
  el.innerHTML=`<img src="logo.png" alt=""><div class="h" style="font-size:18px">${title||'FINANZAS'}</div><small>${msg||(lockMode==='check'?(L&&L.cred?'Face ID o ingresá tu PIN':'Ingresá tu PIN'):'')}</small><div class="dots">${[0,1,2,3,4,5].map(i=>`<i class="${i<pinBuf.length?'on':''}"></i>`).join('')}</div>
  <div class="pin">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}<button data-k="face" style="font-size:12px">${L&&L.cred&&lockMode==='check'?'Face ID':''}</button><button data-k="0">0</button><button data-k="del">⌫</button></div>${lockMode==='check'?'':'<button class="btn" data-k="cancel">Cancelar</button>'}`;
  $$('[data-k]',el).forEach(b=>b.onclick=()=>pinKey(b.dataset.k));
  el.onpointerup=ev=>{const l2=LS.get('lock',null);if(l2&&l2.cred&&lockMode==='check'&&!ev.target.closest('[data-k]'))faceUnlock()}}
async function pinKey(k){const L=LS.get('lock',null);
  if(k==='face'){if(L&&L.cred&&lockMode==='check')faceUnlock();return}
  if(k==='cancel'){pinBuf='';$('#lock').classList.remove('on');pinCb=null;lockMode='check';return}
  if(k==='del')pinBuf=pinBuf.slice(0,-1);else if(pinBuf.length<6)pinBuf+=k;
  drawLock();
  if(lockMode==='check'&&pinBuf.length>=4&&L){const h=await sha(L.salt+pinBuf);if(h===L.pin){pinBuf='';$('#lock').classList.remove('on')}else if(pinBuf.length===6){pinBuf='';drawLock('PIN incorrecto')}}
  if(lockMode!=='check'&&pinBuf.length===6){const cb=pinCb;const p=pinBuf;pinBuf='';cb&&cb(p)}}
let faceBusy=false;
async function faceUnlock(auto){const L=LS.get('lock',null);if(!L||!L.cred||faceBusy)return;faceBusy=true;
  try{await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{id:b642buf(L.cred),type:'public-key',transports:['internal']}],userVerification:'required',hints:['client-device'],timeout:60000}});faceBusy=false;$('#lock').classList.remove('on')}
  catch(e){faceBusy=false;drawLock(auto?'Tocá la pantalla para usar Face ID, o ingresá el PIN':'No se pudo con Face ID. Tocá la pantalla para reintentar o usá el PIN')}}
function askPin(title,cb){lockMode='new';pinBuf='';pinCb=cb;$('#lock').classList.add('on');drawLock('6 dígitos',title)}
ACT2.lockOn=()=>askPin('Elegí un PIN',p1=>askPin('Repetí el PIN',async p2=>{if(p1!==p2){lockMode='check';$('#lock').classList.remove('on');toast('Los PIN no coinciden');return}
  const salt=uid(),h=await sha(salt+p1);LS.set('lock',{pin:h,salt,cred:null,t:60});lockMode='check';$('#lock').classList.remove('on');render();
  if(window.PublicKeyCredential&&confirm('¿Querés usar también Face ID en este iPhone?'))ACT2.faceReg()}));
ACT2.pinChange=()=>askPin('Nuevo PIN',p1=>askPin('Repetí el PIN',async p2=>{lockMode='check';$('#lock').classList.remove('on');if(p1!==p2){toast('No coinciden');return}const L=LS.get('lock'),salt=uid();L.salt=salt;L.pin=await sha(salt+p1);LS.set('lock',L);toast('PIN cambiado')}));
ACT2.lockOff=()=>{if(confirm('¿Quitar el bloqueo?')){LS.del('lock');render()}};
ACT2.faceReg=async()=>{const L=LS.get('lock',null);if(!L)return;
  try{const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Finanzas'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'finanzas',displayName:'Finanzas'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',residentKey:'discouraged',requireResidentKey:false,userVerification:'required'},hints:['client-device'],attestation:'none',timeout:60000}});
    L.cred=buf2b64(c.rawId);LS.set('lock',L);toast('Face ID registrado');render()}catch(e){toast('No se pudo registrar Face ID')}};
ACT2.lockNow=()=>{closeModal();if(!LS.get('lock',null)){toast('Activá el bloqueo en Ajustes');return}lockMode='check';pinBuf='';showLock()};
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{const L=LS.get('lock',null);if(!L)return;
  if(document.hidden)hiddenAt=Date.now();else if(hiddenAt&&(Date.now()-hiddenAt)/1000>=(+L.t||0)){lockMode='check';pinBuf='';showLock();if(L.cred)setTimeout(()=>faceUnlock(true),250)}});
/* ===== conexión inicial ===== */
function showSetup(){const el=$('#setup');el.classList.add('on');
  el.innerHTML=`<img src="logo.png" alt=""><div class="h" style="font-size:20px">FINANZAS</div><small>Conectá la app con tu planilla</small><div class="sset"><div class="fl"><label>URL de tu Apps Script (termina en /exec)</label><input id="su" value="${esc(CFG.url)}" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off" autocorrect="off"></div>
   <div class="fl"><label>Token de acceso</label><input id="st" type="password" value="${esc(CFG.token)}" placeholder="El que te mostró el script" autocapitalize="off" autocorrect="off"></div><div class="acts" style="justify-content:stretch"><button class="btn wh" id="sgo" style="flex:1;justify-content:center">Conectar</button></div><small id="smsg" style="display:block;margin-top:10px"></small><small style="display:block;margin-top:8px">Se guardan solo en este dispositivo.</small></div>`;
  $('#sgo').onclick=async()=>{const u=$('#su').value.trim(),t=$('#st').value.trim();if(!/^https:\/\/script\.google\.com\//.test(u)){$('#smsg').textContent='La URL tiene que empezar con https://script.google.com/';return}
    $('#smsg').textContent='Conectando…';CFG.url=u;CFG.token=t;
    try{const r=await apiGet('ping');if(!r.ok)throw new Error(r.error||'sin respuesta');LS.set('url',u);LS.set('token',t);el.classList.remove('on');await start()}catch(e){$('#smsg').textContent='No pude conectar: '+e.message+'. Revisá la URL, el token y que la implementación sea "Cualquier persona".'}}}
/* Día a día siempre está pago: corrige los que quedaron sin pagar en la planilla */
function fixDia(){if(!S.live)return;const L=D('Egresos').filter(e=>isDia(e)&&Number(e.pagado)!==1);if(!L.length)return;L.forEach(e=>{e.pagado=1});persist();send({op:'batch',ops:L.map(e=>({op:'upsert',table:'Egresos',row:{id:e.id,pagado:1}}))})}
/* sin zoom: ni pellizco ni doble toque */
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1||(e.scale&&e.scale!==1))e.preventDefault()},{passive:false});
/* ===== inicio ===== */
async function start(){
  document.body.classList.toggle('hide-all',!!LS.get('hideall',false));
  render();
  const ok=await load();ensureDefaults();fixDia();render();
  if(ok&&queue.length)flush()}
async function boot(){
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(LS.get('lock',null)){lockMode='check';showLock();const L=LS.get('lock');if(L.cred)setTimeout(()=>faceUnlock(true),300)}
  if(!CFG.url||!CFG.token){showSetup();return}
  await start()}
addEventListener('online',flush);
boot();

</script></body></html>
